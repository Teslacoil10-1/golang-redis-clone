syntax = "proto3";

option go_package = "./pb";

service KeyValueStore {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc BFAdd(BFAddRequest) returns (BFAddResponse);
  rpc BFExists(BFExistsRequest) returns (BFExistsResponse);
  rpc BGRewrite(BGRewriteRequest) returns (BGRewriteResponse);
  rpc HSet(HSetRequest) returns (HSetResponse);
  rpc HGet(HGetRequest) returns (HGetResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc Publish(PublishRequest) returns (PublishResponse);
}

message SetRequest {
  string key = 1;
  string value = 2;
  int64 ttl = 3;
}

message SetResponse {
  bool success = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  bool exists = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message BFAddRequest {
  string key = 1;
}

message BFAddResponse {
  bool success = 1;
}

message BFExistsRequest {
  string key = 1;
}

message BFExistsResponse {
  bool exists = 1;
}

message BGRewriteRequest {}
message BGRewriteResponse {
  string status = 1;
}

message HSetRequest {
  string key = 1;
  string field = 2;
  string value = 3;
}

message HSetResponse {
  bool success = 1;
}

message HGetRequest {
  string key = 1;
  string field = 2;
}

message HGetResponse {
  string value = 1;
  bool exists = 2;
}

message InfoRequest {}

message InfoResponse {
  uint64 hits = 1;
  uint64 misses = 2;
  uint64 evictions = 3;
  uint64 keys = 4;
}

message SubscribeRequest {
  string channel = 1;
}

message SubscribeResponse {
  string message = 1;
  string channel = 2; 
}

message PublishRequest {
  string channel = 1;
  string message = 2;
}

message PublishResponse {
  int32 subscribers_reached = 1;
}
