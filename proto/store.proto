syntax = "proto3";

option go_package = "./pb";

service KeyValueStore {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc BFAdd(BFAddRequest) returns (BFAddResponse);
  rpc BFExists(BFExistsRequest) returns (BFExistsResponse);
  rpc BGRewrite(BGRewriteRequest) returns (BGRewriteResponse);
}

message SetRequest {
  string key = 1;
  string value = 2;
}

message SetResponse {
  bool success = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  bool exists = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message BFAddRequest {
  string key = 1;
}

message BFAddResponse {
  bool success = 1;
}

message BFExistsRequest {
  string key = 1;
}

message BFExistsResponse {
  bool exists = 1;
}

message BGRewriteRequest {}
message BGRewriteResponse {
  string status = 1;
}
